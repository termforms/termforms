# TermForms continuous integration.
#
# Every push to main (and every pull request) is built and tested on Linux,
# macOS (Apple Silicon) and Windows x64, with warnings treated as errors.
# Runner images are pinned to explicit versions rather than "-latest", so an
# image upgrade is a deliberate change here, not a surprise.

name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A newer push to the same branch cancels the run still in progress.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-test:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: Linux gcc,       os: ubuntu-24.04,  preset: ci-unix,    cc: gcc,   cxx: g++ }
          - { name: Linux clang,     os: ubuntu-24.04,  preset: ci-unix,    cc: clang, cxx: clang++ }
          - { name: macOS clang,     os: macos-15,      preset: ci-unix,    cc: clang, cxx: clang++ }
          - { name: Windows MSVC,    os: windows-2025,  preset: ci-windows, cc: "",    cxx: "" }
    env:
      CC: ${{ matrix.cc }}
      CXX: ${{ matrix.cxx }}
    steps:
      - uses: actions/checkout@v5

      # Python supplies Ninja on every platform (Windows uses the Visual Studio
      # generator and ignores it).
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install Ninja
        run: python -m pip install ninja

      - name: Configure
        run: cmake --preset ${{ matrix.preset }}
      - name: Build
        run: cmake --build --preset ${{ matrix.preset }}
      - name: Test
        run: ctest --preset ${{ matrix.preset }}

  sanitizers:
    name: Sanitizers (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # LeakSanitizer is active on Linux only; macOS does not support it.
          - { name: Linux gcc,   os: ubuntu-24.04 }
          - { name: macOS clang, os: macos-15 }
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install Ninja
        run: python -m pip install ninja
      - name: Configure
        run: cmake --preset ci-asan
      - name: Build
        run: cmake --build --preset ci-asan
      - name: Test
        run: ctest --preset ci-asan

  format:
    name: Formatting
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      # Pinned to the version in toolchain.txt; formatter versions disagree
      # on details, so everyone must run the same one.
      - name: Install clang-format
        run: python -m pip install clang-format==23.1.3
      - name: Check formatting
        run: |
          git ls-files '*.c' '*.h' '*.cpp' '*.hpp' ':!:third_party/**' \
            | xargs clang-format --dry-run --Werror
