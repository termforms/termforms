# TermForms continuous integration.
#
# Every push to main (and every pull request) is built and tested on Linux,
# macOS (Apple Silicon) and Windows x64, with warnings treated as errors.
# Runner images are pinned to explicit versions rather than "-latest", so an
# image upgrade is a deliberate change here, not a surprise.
#
# The run tests compile real TermForms programs with whichever C compiler
# TFC_CC names, so the jobs below cover each supported compiler: gcc, clang,
# Apple clang, MSVC (cl) and zig cc, plus the zig cross build from macOS to a
# static Linux binary that is the everyday deployment path.

name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A newer push to the same branch cancels the run still in progress.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  ZIG_VERSION: "0.16.0" # keep in step with toolchain.txt

jobs:
  build-test:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: Linux gcc,        os: ubuntu-24.04, preset: ci-unix,    cc: gcc,   cxx: g++,     tfc_cc: gcc }
          - { name: Linux clang,      os: ubuntu-24.04, preset: ci-unix,    cc: clang, cxx: clang++, tfc_cc: clang }
          - { name: macOS clang,      os: macos-15,     preset: ci-unix,    cc: clang, cxx: clang++, tfc_cc: cc }
          - { name: Windows MSVC,     os: windows-2025, preset: ci-windows, cc: "",    cxx: "",      tfc_cc: cl }
    env:
      CC: ${{ matrix.cc }}
      CXX: ${{ matrix.cxx }}
      TFC_CC: ${{ matrix.tfc_cc }}
    steps:
      - uses: actions/checkout@v5

      # Python runs the end-to-end tests and supplies Ninja on every platform
      # (Windows builds with the Visual Studio generator and ignores Ninja).
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install Ninja
        run: python -m pip install ninja

      # gdb, for the debugger test (debug.gdb); macOS has lldb already.
      - name: Install gdb
        if: matrix.name == 'Linux gcc'
        run: sudo apt-get update && sudo apt-get install -y gdb

      # Programs built by tfc with cl need the MSVC environment; tfc itself
      # is built by the Visual Studio generator, which finds it on its own.
      - name: MSVC environment
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1

      - name: Configure
        run: cmake --preset ${{ matrix.preset }}
      - name: Build
        run: cmake --build --preset ${{ matrix.preset }}
      - name: Test
        run: ctest --preset ${{ matrix.preset }}

  zig:
    name: zig cc (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: Linux,   os: ubuntu-24.04, preset: ci-unix }
          - { name: macOS,   os: macos-15,     preset: ci-unix }
          - { name: Windows, os: windows-2025, preset: ci-windows }
    env:
      TFC_CC: python -m ziglang cc
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      # zig from PyPI: one pinned version, the same on every platform.
      - name: Install Ninja and zig
        run: python -m pip install ninja ziglang==${{ env.ZIG_VERSION }}
      - name: Configure
        run: cmake --preset ${{ matrix.preset }}
      - name: Build
        run: cmake --build --preset ${{ matrix.preset }}
      - name: Run tests with zig cc
        run: ctest --preset ${{ matrix.preset }} -L run

  cross-build:
    name: Cross build (macOS to Linux x86-64)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install Ninja and zig
        run: python -m pip install ninja ziglang==${{ env.ZIG_VERSION }}
      - name: Build tfc
        run: |
          cmake --preset ci-unix
          cmake --build --preset ci-unix --target tfc
      - name: Cross-compile hello.bas to a static Linux binary
        working-directory: examples
        run: |
          ../build/ci-unix/compiler/tfc -v \
            --cc "python -m ziglang cc -target x86_64-linux-musl" \
            -o hello-linux-x86_64 hello.bas
          file hello-linux-x86_64
      - uses: actions/upload-artifact@v7
        with:
          name: hello-linux-x86_64
          path: examples/hello-linux-x86_64

  cross-run:
    name: Run the cross build on Linux
    needs: cross-build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: hello-linux-x86_64
      - name: Run headless
        run: |
          chmod +x hello-linux-x86_64
          file hello-linux-x86_64 | grep -q "statically linked"
          TERMFORMS_HEADLESS='CI{TAB}{ENTER}' ./hello-linux-x86_64 | tee screen.txt
          grep -q "Hello, CI! (1)" screen.txt

  sanitizers:
    name: Sanitizers (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # LeakSanitizer is active on Linux only; macOS does not support it.
          - { name: Linux gcc,   os: ubuntu-24.04 }
          - { name: macOS clang, os: macos-15 }
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install Ninja
        run: python -m pip install ninja
      - name: Configure
        run: cmake --preset ci-asan
      - name: Build
        run: cmake --build --preset ci-asan
      - name: Test
        # TF_SANITIZE instruments tfc and the runtime tests; TFC_CC also
        # instruments the programs the run tests compile, which is where
        # reference-counting mistakes in generated code would show.
        env:
          TFC_CC: cc -fsanitize=address,undefined -fno-sanitize-recover=all -fno-omit-frame-pointer
        run: ctest --preset ci-asan

  format:
    name: Formatting
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      # Pinned to the version in toolchain.txt; formatter versions disagree
      # on details, so everyone must run the same one.
      - name: Install clang-format
        run: python -m pip install clang-format==23.1.3
      - name: Check formatting
        run: |
          git ls-files '*.c' '*.h' '*.cpp' '*.hpp' ':!:third_party/**' ':!:tests/golden/**' \
            | xargs clang-format --dry-run --Werror
